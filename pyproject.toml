[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodeagent"
version = "0.1.0"
description = "A lightweight local Python coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/2889781392to-dot/MiniCodeAgent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
